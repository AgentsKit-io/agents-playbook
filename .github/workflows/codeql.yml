name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    uses: AgentsKit-io/.github/.github/workflows/codeql.yml@f0d4ae0bf5c4f1107def8a323fdb2a180c25f4f7 # main
    with:
      languages: javascript-typescript
      build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
