name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 3 * * 2"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    uses: AgentsKit-io/.github/.github/workflows/scorecard.yml@f0d4ae0bf5c4f1107def8a323fdb2a180c25f4f7 # main
    permissions:
      contents: read
      id-token: write
      security-events: write
